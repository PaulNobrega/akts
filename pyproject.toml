[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akts"
dynamic = ["version"]
description = "Python library for advanced kinetic analysis of thermoanalytical and reaction kinetics data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Nobrega", email = "Paul@PaulNobrega.net" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/PaulNobrega/akts"
Repository = "https://github.com/PaulNobrega/akts"

[tool.hatch.version]
path = "akts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["akts"]
